name: Contribution Jet

on:
  schedule:
    - cron: "0 */12 * * *"      # twice a day
  workflow_dispatch:            # lets you run it manually from the Actions tab
  push:
    branches: [main]
    paths: [".github/jet/**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate the jet game from my contribution graph
        run: python .github/jet/jet.py "${{ github.repository_owner }}" assets/contribution-jet.svg

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-jet.svg
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update contribution jet"
            git push
          fi
