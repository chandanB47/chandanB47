<radialGradient id="pulse"><stop offset="0" stop-color="#FDEBCF"/><stop offset=".5" stop-color="#F8D299" stop-opacity=".6"/><stop offset="1" stop-color="#C08DCB" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#F8D299" stroke-opacity=".09"/></pattern>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#FDEBCF" opacity=".025"/></pattern>
<radialGradient id="glowC" cx="95%" cy="105%" r="50%"><stop offset="0" stop-color="#804A8A" stop-opacity=".45"/><stop offset="1" stop-color="#804A8A" stop-opacity="0"/></radialGradient>
<radialGradient id="orbE"><stop offset="0" stop-color="#C08DCB" stop-opacity=".34"/><stop offset="1" stop-color="#C08DCB" stop-opacity="0"/></radialGradient>
<radialGradient id="orbG"><stop offset="0" stop-color="#F59E51" stop-opacity=".22"/><stop offset="1" stop-color="#F59E51" stop-opacity="0"/></radialGradient>
<linearGradient id="shineG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FDEBCF" stop-opacity="0"/><stop offset=".5" stop-color="#FDEBCF" stop-opacity=".22"/><stop offset="1" stop-color="#FDEBCF" stop-opacity="0"/></linearGradient>

</defs>
<style>
.serif{font-family:Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace} .sans{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif}
.in{animation:in 1s cubic-bezier(.16,1,.3,1) both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes blink{50%{opacity:.15}}
@keyframes pop{0%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes ty{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.2);opacity:0}}
@keyframes float{50%{transform:translateY(-6px)}}
.ib{transform-box:fill-box;transform-origin:center}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g class="in"><text class="sans" x="40" y="34" font-size="12" fill="#F59E51" ></text><text class="mono" x="40" y="34" font-size="12" letter-spacing="3" fill="#C08DCB"><tspan fill="#F59E51">03</tspan>   STACK</text></g>
<g class="in" style="animation-delay:.2s"><text class="serif" x="38" y="84" font-size="44" font-weight="300" letter-spacing="-1" fill="#FDEBCF">The tools <tspan font-style="italic" fill="url(#sheen)">I reach for.</tspan></text></g>
<g class="in" style="animation-delay:.45s"><text class="mono" x="1160" y="34" font-size="10.5" fill="#BC8E91" text-anchor="end" letter-spacing="2.4" >WHAT I USE</text></g>
