<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-label="03 Stack: The tools I reach for.">
<title>03 Stack: The tools I reach for.</title><desc>03 Stack: The tools I reach for.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3A0353"/><stop offset="1" stop-color="#1D0229"/></linearGradient>
<radialGradient id="glowE" cx="85%" cy="15%" r="70%"><stop offset="0" stop-color="#804A8A" stop-opacity=".9"/><stop offset="1" stop-color="#3A0353" stop-opacity="0"/></radialGradient>
<radialGradient id="glowG" cx="5%" cy="100%" r="55%"><stop offset="0" stop-color="#F59E51" stop-opacity=".34"/><stop offset="1" stop-color="#F59E51" stop-opacity="0"/></radialGradient>
<linearGradient id="sheen" gradientUnits="userSpaceOnUse" x1="-400" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#F8D299"/><stop offset=".5" stop-color="#F59E51"/><stop offset="1" stop-color="#F8D299"/><animateTransform attributeName="gradientTransform" type="translate" values="0 0;1700 0;1700 0" keyTimes="0;.45;1" dur="7s" begin="1.2s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F8D299"/><stop offset="1" stop-color="#804A8A"/></linearGradient>
