@keyframes draw{to{stroke-dashoffset:0}}
@keyframes blink{50%{opacity:.15}}
@keyframes pop{0%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes ty{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.2);opacity:0}}
@keyframes float{50%{transform:translateY(-6px)}}
.ib{transform-box:fill-box;transform-origin:center}

