<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" role="img">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset=".55" stop-color="#eef6ff"/><stop offset="1" stop-color="#ecfdf5"/></linearGradient>
  <linearGradient id="cyan"><stop stop-color="#00e5ff"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
  <linearGradient id="green"><stop stop-color="#22c55e"/><stop offset="1" stop-color="#86efac"/></linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#dbe5ef"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .m{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.s{font-family:Segoe UI,Arial,sans-serif}
    .dash{stroke-dasharray:8 10;animation:d 7s linear infinite}.pulse{animation:p 2s ease-in-out infinite}
    .bar{transform-box:fill-box;transform-origin:bottom;animation:b 2.8s ease-in-out infinite alternate}
    @keyframes d{to{stroke-dashoffset:-140}} @keyframes p{50%{opacity:.3}} @keyframes b{from{transform:scaleY(.7)}to{transform:scaleY(1)}}
  </style>
</defs>

